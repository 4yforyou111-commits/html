<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Gallery</title>
        <style>
            .gallery {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 200px;
                gap: 6px;
                max-width: 900px;
                margin: 0 auto;
            }

            .gallery img {
                width: 100%;
                height: 100%;
                display: block;
            }
        </style>
    </head>
    <body>

        <div class="gallery">
            <img src="https://picsum.photos/id/1018/400/300">
            <img src="https://picsum.photos/id/1015/400/300">
            <img src="https://picsum.photos/id/1043/400/300">
            <img src="https://picsum.photos/id/1076/400/300">
            <img src="https://picsum.photos/id/1080/400/300">
            <img src="https://picsum.photos/id/1059/400/300">
            <img src="https://picsum.photos/id/1074/400/300">
            <img src="https://picsum.photos/id/1062/400/300">
        </div>

    </body>
</html>
